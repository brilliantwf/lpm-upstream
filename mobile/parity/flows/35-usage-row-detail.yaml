appId: cx.lpm.mobile
name: 35-usage-row-detail
tags: [demo, usage]
---
- runFlow: subflows/enter-demo.yaml
# A usage row reads out its account and tag ("Work, pool"); tapping it opens
# both of its windows, which the desktop shows on hover.
- scrollUntilVisible:
    element: "Work, pool"
    direction: DOWN
- tapOn: "Work, pool"
- extendedWaitUntil:
    visible: ".*OPUS 4.6.*"
    timeout: 5000
- assertVisible: "Weekly window usage"
- assertVisible: "5-hour window usage"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 1-work-expanded
# The last line sits below the fold on the iPhone.
- scrollUntilVisible:
    element: "The main accounts can switch to this account"
    direction: DOWN
# Back to the top: the row can count as "visible" while it sits under the header.
- scrollUntilVisible:
    element: "storefront"
    direction: UP
- tapOn: "Work, pool"
- waitForAnimationToEnd:
    timeout: 3000
- assertNotVisible: "The main accounts can switch to this account"
