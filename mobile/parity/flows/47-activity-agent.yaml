appId: cx.lpm.mobile
name: 47-activity-agent
tags: [demo, activity, terminal]
---
- runFlow: subflows/enter-demo.yaml
# Opening storefront's Claude tab starts its scripted session, which works for
# about 37 seconds and then waits for an answer.
- tapOn: "storefront"
- extendedWaitUntil:
    visible: "Claude"
    timeout: 5000
- tapOn: "Claude"
# The composer holds a seeded draft, so wait on the key bar rather than its hint.
- extendedWaitUntil:
    visible: "esc"
    timeout: 10000
- runFlow: subflows/back.yaml
- extendedWaitUntil:
    visible: "Terminal 1"
    timeout: 5000
- runFlow: subflows/back.yaml
- runFlow: subflows/open-more-menu.yaml
- retry:
    maxRetries: 2
    commands:
      - tapOn: "Activity.*"
      - extendedWaitUntil:
          visible: "· Claude Code"
          timeout: 5000
# The row shows up working; it turns to "Needs you" once the script finishes.
- extendedWaitUntil:
    visible: "Needs you"
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 1-activity-agent
# A wait can't be cleared from here: the row says why instead.
- swipe:
    from: "Needs you"
    direction: LEFT
- tapOn: "Why?"
- extendedWaitUntil:
    visible: "This row stays until it's done"
    timeout: 3000
- assertVisible: "The agent is asking for you — answering it is what clears this."
- takeScreenshot: 2-activity-why
- tapOn: "OK"
