appId: cx.lpm.mobile
name: 53-git-switch-branch
tags: [demo, git]
---
- runFlow: subflows/enter-demo.yaml
- tapOn: "storefront"
- extendedWaitUntil:
    visible: "Tabs"
    timeout: 5000
- tapOn: "More"
- extendedWaitUntil:
    visible: "Git"
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 3000
# On iOS a tap while the menu is still settling can miss: tap again if nothing changed.
- tapOn:
    text: "Git"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "Switch Branch…"
    timeout: 5000
- tapOn: "Switch Branch…"
- extendedWaitUntil:
    visible: "fix/cart-badge"
    timeout: 5000
- assertVisible: "Switch Branch"
- assertVisible: "feat/checkout-redesign"
- assertVisible: "origin"
- takeScreenshot: 1-branches
# "+" is labelled "New branch" on both platforms.
- tapOn: "New branch"
- extendedWaitUntil:
    visible: "Creates a new branch off the current HEAD and checks it out."
    timeout: 5000
- takeScreenshot: 2-new-branch
- inputText: "feat/receipts"
- tapOn: "Create"
- extendedWaitUntil:
    notVisible: "Switch Branch"
    timeout: 5000
# Reopened, the sheet loads the list afresh with the new branch current.
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: "More"
- extendedWaitUntil:
    visible: "Git"
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 3000
# On iOS a tap while the menu is still settling can miss: tap again if nothing changed.
- tapOn:
    text: "Git"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "Switch Branch…"
    timeout: 5000
- tapOn: "Switch Branch…"
- extendedWaitUntil:
    visible: "feat/receipts.*"
    timeout: 5000
- assertVisible: "feat/checkout-redesign.*"
- takeScreenshot: 3-switched
# The current branch can't be picked: tapping it starts no checkout, so the sheet
# stays open.
- tapOn: "feat/receipts.*"
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible: "Switch Branch"
- assertVisible: "feat/receipts.*"
