appId: cx.lpm.mobile
name: 120-activity-search-empty
tags: [demo, activity]
---
- runFlow: subflows/enter-demo.yaml
- runFlow: subflows/open-more-menu.yaml
- retry:
    maxRetries: 2
    commands:
      - tapOn: "Activity.*"
      - extendedWaitUntil:
          visible: "2 of 3 running"
          timeout: 5000
# A search that matches nothing under All only suggests another search.
- tapOn: "Search projects and agents"
- inputText: "zzz"
- extendedWaitUntil:
    visible: "Nothing matches"
    timeout: 3000
- assertVisible: "Try a different search."
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: "Search"
- runFlow:
    when:
      platform: Android
    commands:
      - pressKey: Enter
      - hideKeyboard
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 1-search-all
# Narrowed to a kind as well, it can also point back to All.
- tapOn: "Automations"
- extendedWaitUntil:
    visible: "Try a different search, or switch back to All."
    timeout: 3000
- takeScreenshot: 2-search-kind
