appId: cx.lpm.mobile
name: 51-git-file-viewed
tags: [demo, git]
---
- runFlow: subflows/enter-demo.yaml
- tapOn: "storefront"
- extendedWaitUntil:
    visible: "Tabs"
    timeout: 5000
- tapOn: "More"
- retry:
    maxRetries: 2
    commands:
      - tapOn: "Review Changes.*"
      - extendedWaitUntil:
          visible: "components/CheckoutForm.tsx"
          timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
# Each file's header: "Include in commit", the path (collapses the diff),
# "Viewed" and "More". Marking the first file viewed collapses it.
- tapOn:
    text: "Viewed"
    index: 0
- extendedWaitUntil:
    visible: "1 of 4 reviewed"
    timeout: 5000
- takeScreenshot: 1-viewed
# Unselecting a file leaves it out of the commit.
- tapOn:
    text: "Include in commit"
    index: 1
- scrollUntilVisible:
    element: "Commit 3 files"
    direction: DOWN
- takeScreenshot: 2-unselected
