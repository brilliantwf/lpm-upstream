appId: cx.lpm.mobile
name: 51-git-file-viewed
tags: [demo, git]
---
- runFlow: subflows/enter-demo.yaml
- tapOn: "storefront"
- extendedWaitUntil:
    visible: "Tabs"
    timeout: 5000
- tapOn: "More"
- retry:
    maxRetries: 2
    commands:
      - tapOn: "Review Changes.*"
      - extendedWaitUntil:
          visible: "components/CheckoutForm.tsx"
          timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
# Each file's header: the name (collapses the diff), "Viewed" and "More".
# Marking the first file viewed collapses it.
- tapOn:
    text: "Viewed"
    index: 0
- extendedWaitUntil:
    visible: ".*1 of 4 viewed"
    timeout: 5000
- takeScreenshot: 1-viewed
# Unselecting a file in the commit sheet leaves it out of the commit.
- tapOn: "Commit 4 files"
- extendedWaitUntil:
    visible: "Deselect All"
    timeout: 5000
- tapOn: "app/checkout/page.tsx"
- takeScreenshot: 2-unselected
- tapOn: "Cancel"
- extendedWaitUntil:
    visible: "Commit 3 files"
    timeout: 5000
- assertVisible: "Excluded"
- takeScreenshot: 3-excluded
