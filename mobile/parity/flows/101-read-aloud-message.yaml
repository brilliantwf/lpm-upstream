# An automation run's reply read aloud: its speaker button starts the reader, whose
# bar appears under the navigation bar with the transport; Pause turns into Play,
# and "Stop reading" ends it and gives the message its "Read aloud" back. Nothing
# here depends on hearing the voice.
appId: cx.lpm.mobile
name: 101-read-aloud-message
tags: [demo, automations, speech]
---
- runFlow: subflows/enter-demo.yaml
- runFlow: subflows/open-more-menu.yaml
- retry:
    maxRetries: 2
    commands:
      - tapOn: "Automations.*"
      - extendedWaitUntil:
          visible: "Nightly tests"
          timeout: 5000
- tapOn: "Nightly tests"
- extendedWaitUntil:
    visible: "Run history"
    timeout: 5000
- scrollUntilVisible:
    element: "Problem during the run"
- tapOn: "Problem during the run"
- extendedWaitUntil:
    visible: "Read aloud"
    timeout: 5000
- tapOn: "Read aloud"
- extendedWaitUntil:
    visible: "Pause"
    timeout: 5000
- assertVisible: "Previous sentence"
- assertVisible: "Next sentence"
- assertVisible: "Speed.*"
- tapOn: "Pause"
- extendedWaitUntil:
    visible: "Play"
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 1-reading-paused
- tapOn:
    text: "Stop reading"
    index: 0
- extendedWaitUntil:
    notVisible: "Play"
    timeout: 5000
- assertVisible: "Read aloud"
- assertNotVisible: "Stop reading"
