appId: cx.lpm.mobile
name: 45-activity-filters
tags: [demo, activity]
---
- runFlow: subflows/enter-demo.yaml
- runFlow: subflows/open-more-menu.yaml
- retry:
    maxRetries: 2
    commands:
      - tapOn: "Activity.*"
      - extendedWaitUntil:
          visible: "2 of 3 running"
          timeout: 5000
# The demo's only activity is storefront's services, so Agents has nothing.
- tapOn: "Agents"
- extendedWaitUntil:
    visible: "Nothing matches"
    timeout: 3000
- assertVisible: "No agents are running. Switch back to All to see the rest."
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 1-activity-agents
# A search narrows the service card to what matches: worker alone, not running.
- tapOn: "Services"
- tapOn: "Search projects and agents"
- inputText: "work"
- extendedWaitUntil:
    visible: "0 of 1 running"
    timeout: 3000
# A chip is named by what tapping it does, as iOS labels it.
- assertVisible: "Start the worker service"
- assertNotVisible: "web"
# iOS's search keyboard has no standard dismiss Maestro can use; its search key
# ends editing instead.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: "Search"
- runFlow:
    when:
      platform: Android
    commands:
      # Submit like the keyboard's search key, then make sure the keyboard is down
      # (Maestro's injected Enter doesn't always close it).
      - pressKey: Enter
      - hideKeyboard
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 2-activity-search
