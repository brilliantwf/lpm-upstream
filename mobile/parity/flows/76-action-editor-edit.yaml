appId: cx.lpm.mobile
name: 76-action-editor-edit
tags: [demo, actions, config]
---
- runFlow: subflows/enter-demo.yaml
- tapOn: "storefront"
- extendedWaitUntil:
    visible: "Tabs"
    timeout: 5000
- tapOn: "Actions"
- extendedWaitUntil:
    visible: "Lint"
    timeout: 5000
# A long press offers the editor, seeded from the action's YAML body.
- longPressOn: "Lint"
- tapOn: "Edit Action…"
- extendedWaitUntil:
    visible: "Edit Action"
    timeout: 5000
- extendedWaitUntil:
    visible: "npm run lint"
    timeout: 5000
- assertVisible: "Runs in the terminal you're currently using."
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 1-edit-action
- scrollUntilVisible:
    element: "Delete action"
- tapOn: "Delete action"
- extendedWaitUntil:
    visible: "Delete this action?"
    timeout: 5000
- takeScreenshot: 2-confirm-delete
- tapOn: "Delete"
- extendedWaitUntil:
    notVisible: "Edit Action"
    timeout: 5000
- extendedWaitUntil:
    notVisible: "Lint"
    timeout: 5000
- assertVisible: "Test"
