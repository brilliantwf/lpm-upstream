services:
  dev:
    cmd: npm run tauri dev
    cwd: ./desktop/frontend/

  website:
    cmd: npm run dev
    cwd: ./website
    port: 3000

profiles:
  dev:
    - dev

actions:
  release:
    label: 🚀 Release · {{git.tag:v*}} · {{git.tagAge:v*}}
    type: background
    cmd: ./scripts/release.sh {{bump}} {{channel}}
    confirm: true
    inputs:
      bump:
        type: radio
        label: What kind of release?
        options:
          - label: Patch — bug fixes ({{git.nextPatch:v*}})
            value: patch
          - label: Minor — new features ({{git.nextMinor:v*}})
            value: minor
          - label: Major — breaking changes ({{git.nextMajor:v*}})
            value: major
        default: patch
        required: true
      channel:
        type: radio
        label: Who gets it?
        options:
          - label: Stable — everyone
            value: stable
          - label: Beta — only apps on the Beta update channel
            value: beta
        default: stable
        required: true
    position: 1
    display: footer
